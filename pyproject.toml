[project]
name = "blabtodo"
# Not used at runtime. Releases are numbered by Git tags; see docs/development.md.
version = "0.0.0"
description = "A home task manager for one family"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "django~=6.1",
    "django-tailwind-cli>=4.8.2",
    "gunicorn>=27.0.0 ; sys_platform != 'win32'",
    "pillow>=13.0.0",
    "segno>=1.6.6",
    "tzdata>=2026.6",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "polib>=1.2.0",
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "pytest-playwright>=0.10.0",
    "ruff>=0.17.4",
]

[tool.uv]
# This is an application, not a library: nothing is built or installed as a package.
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "DJ", "SIM", "C4"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
python_files = ["test_*.py"]
testpaths = ["tests"]
# The browser tests need a test browser installed, so they run only when asked for:
#     uv run pytest -m browser
addopts = "-ra -m 'not browser'"
markers = ["browser: taps through the pages in a real browser"]
